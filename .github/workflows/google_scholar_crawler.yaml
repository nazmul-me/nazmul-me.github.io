name: Get Citation Data

on:
 page_build:
 workflow_dispatch:
 schedule:
  - cron:  '0 */6 * * *'

# A newer run replaces one that is still waiting on Google Scholar
concurrency:
  group: citation-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Successful runs take ~30s; when Google Scholar blocks the runner,
    # scholarly retries forever, so stop it instead of waiting 6 hours
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        if [ ! -f results/gs_data.json ]; then
          echo "Google Scholar blocked this run; nothing to push"
          exit 0
        fi
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}